[Launcher]
; Game folder. Leave empty when the launcher is inside the game folder.
; Absolute (D:\Games\AstroRanger) or relative to the launcher (..\AstroRanger).
; A folder passed on the command line overrides this.
GameDir=
; 1 = leave the local server window on screen, 0 = keep it out of the way
ShowServer=0
; Hide the server window completely once the game has logged in (0 = leave it off-screen)
HideServerAfterConnect=1
; Close Start.exe automatically when the game exits
CloseServerOnExit=1
; Max seconds to wait for the server to start up
ServerWaitSeconds=15
; Extra wait (ms) after the server is up, so its login page/ActiveX can load, before pressing the launch button
ExtraDelayMs=2500
Server=Start.exe
Game=Astro Ranger.exe
